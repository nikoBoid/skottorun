services:
  app:
    image: scottorun-app:latest
    build:
      context: .
      target: runtime
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${PUBLIC_HOST}
        VITE_REVERB_PORT: 443
        VITE_REVERB_SCHEME: https
    restart: unless-stopped
    env_file: ${SCOTTORUN_ENV_FILE:-.env.production}
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database-data/database.sqlite
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      RUN_MIGRATIONS: "true"
    volumes:
      - ./data/database:/var/www/html/database-data
      - ./data/storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "artisan", "migrate:status", "--no-ansi"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  queue:
    image: scottorun-app:latest
    restart: unless-stopped
    env_file: ${SCOTTORUN_ENV_FILE:-.env.production}
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database-data/database.sqlite
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=60"]
    volumes:
      - ./data/database:/var/www/html/database-data
      - ./data/storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 384m

  reverb:
    image: scottorun-app:latest
    restart: unless-stopped
    env_file: ${SCOTTORUN_ENV_FILE:-.env.production}
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database-data/database.sqlite
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./data/database:/var/www/html/database-data
      - ./data/storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m

  web:
    image: scottorun-web:latest
    build:
      context: .
      target: web
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${PUBLIC_HOST}
        VITE_REVERB_PORT: 443
        VITE_REVERB_SCHEME: https
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    volumes:
      - ./data/storage/app/public:/var/www/html/public/storage:ro
    networks:
      default:
      climb_edge:
        aliases:
          - scottorun-web
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 128m

networks:
  climb_edge:
    external: true
